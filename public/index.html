<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chalk Talk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">Chalk Talk</h1>
    <p class="tagline">Type a topic. Get a lesson that draws itself and talks you through it.</p>
  </header>

  <form id="topic-form" class="ask">
    <label for="topic" class="ask-label">What do you want to learn?</label>
    <div class="ask-row">
      <input id="topic" name="topic" type="text" autocomplete="off" placeholder="How do volcanoes erupt?" maxlength="300">
      <select id="level" aria-label="Student level">
        <option value="elementary school">Elementary</option>
        <option value="middle school" selected>Middle school</option>
        <option value="high school">High school</option>
        <option value="college">College</option>
      </select>
      <button id="make" type="submit" class="primary">Make lesson</button>
    </div>
    <p id="ask-error" class="ask-error" role="alert"></p>
    <button id="sample" type="button" class="link">Play the sample lesson instead</button>
  </form>

  <main class="stage">
    <p id="lesson-title" class="lesson-title"></p>

    <div class="frame">
      <div id="board" class="board">
        <h2 id="scene-heading" class="chalk heading">Your lesson appears here</h2>
        <!-- Each visual is a chalk card for now. Later: swap in a Muse Image picture with SAM 3.1 cutouts. -->
        <div id="visuals" class="visuals"></div>
        <p id="board-status" class="chalk status">Pick a topic above, or play the sample lesson.</p>
      </div>
    </div>

    <p id="caption" class="caption"></p>

    <div class="controls">
      <button id="prev" type="button" disabled>Back</button>
      <button id="play" type="button" class="primary" disabled>Play</button>
      <button id="next" type="button" disabled>Next</button>
      <button id="replay" type="button" disabled>Replay scene</button>
      <div id="dots" class="dots" role="group" aria-label="Scenes"></div>
    </div>

    <section id="quiz" class="quiz" hidden></section>

    <details class="settings">
      <summary>Voice settings</summary>
      <div class="settings-row">
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div class="settings-row">
        <label for="rate">Speed</label>
        <input id="rate" type="range" min="0.7" max="1.3" step="0.05" value="0.95">
      </div>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
