<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chalk Talk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">Chalk Talk</h1>
    <p class="tagline">Type a topic. Watch it get painted, traced and explained on a chalkboard, and raise your hand any time to ask a question.</p>
  </header>

  <form id="topic-form" class="ask">
    <label for="topic" class="ask-label">What do you want to learn?</label>
    <div class="ask-row">
      <input id="topic" name="topic" type="text" autocomplete="off" placeholder="How do volcanoes erupt?" maxlength="300">
      <select id="level" aria-label="Student level">
        <option value="elementary school">Elementary</option>
        <option value="middle school" selected>Middle school</option>
        <option value="high school">High school</option>
        <option value="college">College</option>
      </select>
      <button id="make" type="submit" class="primary">Make lesson</button>
    </div>
    <p id="ask-error" class="ask-error" role="alert"></p>
    <div class="library">
      <button id="sample" type="button" class="link">Play the sample lesson</button>
      <div id="saved" class="saved" aria-label="Your lessons"></div>
    </div>
  </form>

  <main class="stage">
    <p id="lesson-title" class="lesson-title"></p>

    <div class="frame">
      <div id="board" class="board">
        <!-- The scene picture: painted by Muse Image, parts traced from SAM 3.1 outlines. -->
        <svg id="picture" class="picture" hidden aria-hidden="true"></svg>
        <!-- Chalk cards, used when a scene has no picture. -->
        <div id="visuals" class="visuals"></div>
        <h2 id="scene-heading" class="chalk heading">Your lesson appears here</h2>
        <!-- Shows each Meta model's step while a new lesson is being made. -->
        <div id="build" class="build" hidden></div>
        <p id="board-status" class="chalk status">Pick a topic above, or play the sample lesson.</p>
        <div id="wipe" class="wipe" aria-hidden="true"></div>
      </div>
    </div>

    <p id="caption" class="caption" aria-live="off"></p>

    <div class="controls">
      <button id="prev" type="button" disabled>Back</button>
      <button id="play" type="button" class="primary" disabled>Play</button>
      <button id="next" type="button" disabled>Next</button>
      <button id="replay" type="button" disabled>Replay scene</button>
      <button id="hand" type="button" class="hand" disabled aria-pressed="false"><span aria-hidden="true">✋</span> Raise hand</button>
      <div id="dots" class="dots" role="group" aria-label="Scenes"></div>
    </div>

    <!-- Raise your hand: speak (Muse Voice Transcribe) or type, and Muse Spark answers on the board. -->
    <section id="hand-panel" class="hand-panel" hidden aria-live="polite">
      <p id="hand-status" class="hand-status"></p>
      <form id="hand-form" class="hand-form">
        <input id="hand-text" type="text" autocomplete="off" maxlength="300" placeholder="Or type your question" aria-label="Your question">
        <button type="submit">Ask</button>
        <button id="hand-close" type="button" class="link">Back to the lesson</button>
      </form>
    </section>

    <section id="quiz" class="quiz" hidden></section>

    <details class="settings">
      <summary>Voice settings</summary>
      <p id="voice-note" class="voice-note"></p>
      <div class="settings-row" id="browser-voice-row">
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div class="settings-row">
        <label for="rate">Speed</label>
        <input id="rate" type="range" min="0.7" max="1.3" step="0.05" value="1">
      </div>
    </details>
  </main>

  <script src="/vendor/rough.js"></script>
  <script src="app.js"></script>
</body>
</html>
